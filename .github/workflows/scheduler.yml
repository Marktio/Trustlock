name: Scheduler

# Calls the app's timed jobs (auto approval after the review period, expiry of old proposals).
# Vercel's free plan only runs cron once a day, so GitHub does it every 5 minutes instead.
# Needs two repository secrets: APP_URL (for example https://trustlock.vercel.app, no trailing slash) and CRON_SECRET.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Call the scheduler endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then echo "APP_URL or CRON_SECRET secret is not set"; exit 1; fi
          curl --fail --silent --show-error --max-time 60 -X POST -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/scheduler"
